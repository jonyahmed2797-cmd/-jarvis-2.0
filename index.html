<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>JARVIS — Character Encyclopedia</title>

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@500;600;700;800&display=swap"
      rel="stylesheet">


<style>

/* =====================================================
   JARVIS — PART 1
   FOUNDATION + NAVBAR
   ===================================================== */

:root{

    --bg:#050507;
    --bg-soft:#090a0f;

    --text:#f5f7ff;
    --muted:#8d94a5;

    --purple:#8b5cf6;
    --cyan:#22d3ee;

    --border:rgba(255,255,255,.09);

    --glass:rgba(10,11,16,.72);

}


/* =====================================================
   RESET
   ===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    min-height:100vh;

    background:

        radial-gradient(
            circle at 10% 10%,
            rgba(139,92,246,.09),
            transparent 30%
        ),

        radial-gradient(
            circle at 90% 20%,
            rgba(34,211,238,.06),
            transparent 25%
        ),

        var(--bg);

    color:var(--text);

    font-family:
        Inter,
        Arial,
        sans-serif;

    overflow-x:hidden;

}


/* =====================================================
   SUBTLE BACKGROUND GRID
   ===================================================== */

body::before{

    content:"";

    position:fixed;

    inset:0;

    pointer-events:none;

    z-index:-1;

    background-image:

        linear-gradient(
            rgba(255,255,255,.018) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(255,255,255,.018) 1px,
            transparent 1px
        );

    background-size:60px 60px;

    mask-image:
        linear-gradient(
            to bottom,
            black,
            transparent 85%
        );

}


/* =====================================================
   NAVBAR
   ===================================================== */

.navbar{

    position:fixed;

    top:0;
    left:0;
    right:0;

    height:76px;

    z-index:1000;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:
        0 clamp(18px,5vw,70px);

    background:
        rgba(5,5,7,.68);

    backdrop-filter:
        blur(22px);

    -webkit-backdrop-filter:
        blur(22px);

    border-bottom:
        1px solid
        rgba(255,255,255,.065);

}


/* =====================================================
   LOGO
   ===================================================== */

.logo{

    display:flex;

    align-items:center;

    gap:10px;

    text-decoration:none;

    color:white;

    font-family:Orbitron,sans-serif;

    font-size:19px;

    font-weight:800;

    letter-spacing:2px;

    white-space:nowrap;

}


.logo-icon{

    width:34px;
    height:34px;

    display:grid;

    place-items:center;

    border-radius:10px;

    background:
        linear-gradient(
            135deg,
            var(--purple),
            var(--cyan)
        );

    box-shadow:

        0 0 22px
        rgba(139,92,246,.30);

    font-size:14px;

    color:white;

}


.logo span{

    color:#a78bfa;

}


/* =====================================================
   DESKTOP NAVIGATION
   ===================================================== */

.nav-links{

    display:flex;

    align-items:center;

    gap:28px;

    margin-left:auto;

    margin-right:28px;

}


.nav-links a{

    position:relative;

    color:#9da5b5;

    text-decoration:none;

    font-size:12px;

    font-weight:600;

    letter-spacing:.5px;

    transition:
        color .25s ease;

}


.nav-links a::after{

    content:"";

    position:absolute;

    left:50%;

    bottom:-9px;

    width:0;

    height:2px;

    transform:
        translateX(-50%);

    border-radius:20px;

    background:
        linear-gradient(
            90deg,
            var(--purple),
            var(--cyan)
        );

    transition:
        width .25s ease;

}


.nav-links a:hover{

    color:white;

}


.nav-links a:hover::after{

    width:70%;

}


/* =====================================================
   SEARCH
   ===================================================== */

.nav-search{

    width:190px;

    height:40px;

    display:flex;

    align-items:center;

    gap:9px;

    padding:0 12px;

    border:
        1px solid
        var(--border);

    border-radius:12px;

    background:
        rgba(255,255,255,.035);

    transition:
        border-color .25s,
        background .25s,
        box-shadow .25s;

}


.nav-search:focus-within{

    border-color:
        rgba(139,92,246,.55);

    background:
        rgba(139,92,246,.055);

    box-shadow:
        0 0 25px
        rgba(139,92,246,.08);

}


.search-icon{

    color:#747d8e;

    font-size:14px;

}


.nav-search input{

    width:100%;

    border:0;

    outline:0;

    background:none;

    color:white;

    font-size:11px;

}


.nav-search input::placeholder{

    color:#687080;

}


/* =====================================================
   MOBILE MENU BUTTON
   ===================================================== */

.menu-button{

    display:none;

    width:40px;
    height:40px;

    border:
        1px solid
        var(--border);

    border-radius:11px;

    background:
        rgba(255,255,255,.04);

    color:white;

    cursor:pointer;

    font-size:20px;

}


/* =====================================================
   MOBILE MENU
   ===================================================== */

.mobile-menu{

    position:fixed;

    top:76px;

    left:0;
    right:0;

    z-index:999;

    padding:15px 18px 22px;

    background:
        rgba(5,5,7,.94);

    backdrop-filter:
        blur(25px);

    -webkit-backdrop-filter:
        blur(25px);

    border-bottom:
        1px solid
        var(--border);

    transform:
        translateY(-120%);

    opacity:0;

    pointer-events:none;

    transition:
        transform .35s ease,
        opacity .35s ease;

}


.mobile-menu.active{

    transform:
        translateY(0);

    opacity:1;

    pointer-events:auto;

}


.mobile-menu a{

    display:block;

    padding:14px 5px;

    color:#aeb5c4;

    text-decoration:none;

    font-size:13px;

    font-weight:600;

    border-bottom:
        1px solid
        rgba(255,255,255,.045);

}


.mobile-menu a:last-child{

    border-bottom:0;

}


.mobile-menu a:hover{

    color:white;

}


/* =====================================================
   EMPTY FOUNDATION AREA
   ===================================================== */

.foundation{

    min-height:100vh;

    padding-top:76px;

    display:flex;

    align-items:center;

    justify-content:center;

    text-align:center;

}


.foundation-content{

    padding:30px;

}


.foundation-label{

    display:inline-flex;

    align-items:center;

    gap:8px;

    padding:7px 12px;

    border:
        1px solid
        rgba(139,92,246,.22);

    border-radius:100px;

    background:
        rgba(139,92,246,.06);

    color:#a78bfa;

    font-size:10px;

    font-weight:700;

    letter-spacing:1.5px;

}


.status-dot{

    width:6px;
    height:6px;

    border-radius:50%;

    background:#8b5cf6;

    box-shadow:
        0 0 12px #8b5cf6;

}


.foundation h1{

    margin-top:20px;

    font-family:Orbitron,sans-serif;

    font-size:
        clamp(35px,6vw,65px);

    letter-spacing:-2px;

}


.foundation h1 span{

    background:
        linear-gradient(
            90deg,
            #ffffff,
            #a78bfa,
            #67e8f9
        );

    -webkit-background-clip:text;

    background-clip:text;

    color:transparent;

}


.foundation p{

    max-width:540px;

    margin:
        18px auto 0;

    color:var(--muted);

    font-size:14px;

    line-height:1.8;

}


/* =====================================================
   RESPONSIVE
   ===================================================== */

@media(max-width:1050px){

    .nav-links{

        gap:18px;

        margin-right:18px;

    }

    .nav-search{

        width:160px;

    }

}


@media(max-width:800px){

    .nav-links{

        display:none;

    }

    .nav-search{

        display:none;

    }

    .menu-button{

        display:block;

    }

}


@media(max-width:480px){

    .navbar{

        height:68px;

        padding:
            0 16px;

    }

    .logo{

        font-size:16px;

    }

    .logo-icon{

        width:32px;
        height:32px;

    }

    .mobile-menu{

        top:68px;

    }

    .foundation{

        padding-top:68px;

    }

    .foundation h1{

        font-size:35px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     NAVBAR
     ===================================================== -->

<header class="navbar">


    <!-- LOGO -->

    <a href="#" class="logo">

        <div class="logo-icon">
            J
        </div>

        JARVIS<span>.</span>

    </a>



    <!-- DESKTOP LINKS -->

    <nav class="nav-links">

        <a href="#characters">
            CHARACTERS
        </a>

        <a href="#heroes">
            HEROES
        </a>

        <a href="#villains">
            VILLAINS
        </a>

        <a href="#universes">
            UNIVERSES
        </a>

        <a href="#power">
            POWER INDEX
        </a>

    </nav>



    <!-- SEARCH -->

    <div class="nav-search">

        <span class="search-icon">
            ⌕
        </span>

        <input
            type="text"
            id="searchInput"
            placeholder="Search character..."
        >

    </div>



    <!-- MOBILE BUTTON -->

    <button
        class="menu-button"
        id="menuButton"
        aria-label="Open menu">

        ☰

    </button>

</header>



<!-- =====================================================
     MOBILE NAV
     ===================================================== -->

<div
    class="mobile-menu"
    id="mobileMenu">

    <a href="#characters">
        CHARACTERS
    </a>

    <a href="#heroes">
        HEROES
    </a>

    <a href="#villains">
        VILLAINS
    </a>

    <a href="#universes">
        UNIVERSES
    </a>

    <a href="#power">
        POWER INDEX
    </a>

</div>



<!-- =====================================================
     TEMPORARY FOUNDATION
     ===================================================== -->

<main class="foundation">

    <div class="foundation-content">

        <div class="foundation-label">

            <span class="status-dot"></span>

            SYSTEM ONLINE

        </div>


        <h1>

            THE ULTIMATE
            <span>
                CHARACTER
            </span>
            DATABASE

        </h1>


        <p>

            A premium encyclopedia for legendary heroes,
            villains and powerful characters from across
            different universes.

        </p>

    </div>

</main>



<!-- =====================================================
     JAVASCRIPT
     ===================================================== -->

<script>


/* =====================================================
   MOBILE MENU
   ===================================================== */

const menuButton =
    document.getElementById("menuButton");

const mobileMenu =
    document.getElementById("mobileMenu");


menuButton.addEventListener(
    "click",
    () => {

        mobileMenu.classList.toggle("active");

        if(
            mobileMenu.classList.contains("active")
        ){

            menuButton.textContent = "✕";

        }else{

            menuButton.textContent = "☰";

        }

    }
);


/* Close mobile menu
   when a link is clicked */

document
    .querySelectorAll(".mobile-menu a")
    .forEach(link => {

        link.addEventListener(
            "click",
            () => {

                mobileMenu
                    .classList
                    .remove("active");

                menuButton.textContent = "☰";

            }
        );

    });


/* =====================================================
   SEARCH — FOUNDATION ONLY
   ===================================================== */

const searchInput =
    document.getElementById("searchInput");


searchInput.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            const value =
                this.value.trim();

            if(value){

                console.log(
                    "Search:",
                    value
                );

            }

        }

    }
);

</script>


</body>
</html>
